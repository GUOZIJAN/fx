map $http_upgrade $fx_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 100m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location = /fx-online {
        return 301 /fx-online/;
    }

    location /fx-online/ {
        return 308 https://$host$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fx_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    server_name 8.134.122.85;
    ssl_certificate /etc/letsencrypt/live/8.134.122.85/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.134.122.85/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /fx-online/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fx_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / { return 404; }
}
